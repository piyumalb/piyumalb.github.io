<!DOCTYPE html>
<html lang="en" class="dark">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        darkBg: '#000000',

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Performance optimization for smooth rendering */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        html {
            width: 100%;
            background-color: #000000;
            scroll-behavior: smooth;
        }

        body { 
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
        }

        /* Ambient Glow - Optimized with opacity and hardware acceleration */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.08; 
            transform: translate3d(0, 0, 0); 
            will-change: transform;
        }
        .glow-1 {
            width: 80vw; height: 80vw;
            top: -20%; left: -10%;
            background: radial-gradient(circle, rgba(90, 30, 190, 0.8) 0%, transparent 70%);
        }
        .glow-2 {
            width: 80vw; height: 80vw;
            bottom: -20%; right: -10%;
            background: radial-gradient(circle, rgba(30, 90, 190, 0.8) 0%, transparent 70%);
        }

        /* Main Container Optimization */
        .glass-container {
            background: #060609;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); 
            border-radius: 2.8rem;
            width: 92%;
            max-width: 410px;
            position: relative;
            overflow: hidden;
            padding-bottom: 2rem;
            margin-top: 3rem;
            margin-bottom: 0.5rem; 
            transform: translate3d(0,0,0); 
            backface-visibility: hidden;
            contain: layout; /* Helps browser skip paint logic for unaffected areas */
        }

        /* Cover Image Area */
        .cover-wrapper {
            position: absolute;
            top: 0; 
            left: 0;
            right: 0;
            width: 100%;
            height: 175px; 
            overflow: hidden;
            z-index: 0;
            background-color: #060609;
        }

        .cover-animate {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            will-change: transform;
            animation: panImage 45s linear infinite alternate;
        }
        
        @keyframes panImage {
            0% { transform: scale(1.1) translate3d(0, 0, 0); }
            100% { transform: scale(1.2) translate3d(-2%, -1%, 0); }
        }

        /* Separator Line Optimization */
        .separator-wrapper {
            position: absolute;
            top: 174px; 
            left: 0;
            right: 0;
            height: 3px;
            z-index: 5; 
            background-color: #060609;
            overflow: hidden;
        }

        .separator-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, #000000, #654321, #000000, #654321, #000000);
            animation: flowLine 30s linear infinite;
            will-change: transform;
        }

        @keyframes flowLine {
            to { transform: translate3d(-50%, 0, 0); }
        }

        /* Buttons with zero-lag interactions */
        .btn-ultra {
            position: relative;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .btn-ultra:active {
            transform: scale(0.97) translate3d(0, 1px, 0);
        }

        /* Performance friendly scrollbar */
        ::-webkit-scrollbar {
            width: 0;
        }

        /* Reveal Animation */
        .reveal-up { 
            opacity: 0; 
            transform: translate3d(0, 15px, 0); 
            animation: reveal 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; 
        }
        
        @keyframes reveal { 
            to { opacity: 1; transform: translate3d(0, 0, 0); } 
        }

        /* Optimized Modal Transitions */
        .modal-base {
            transition: opacity 0.25s ease, visibility 0.25s;
        }
        
        .footer-end {
            height: 30px; 
            width: 100%;
        }
    </style>
</head>

    <!-- QR Full-view Modal -->

            <button onclick="closeQRModal()" class="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-semibold text-[14px] transition-colors active:scale-95">Close</button>
        </div>

    <div class="footer-end"></div>

    <script>
        /**
         * Ultra-smooth UI interactions using requestAnimationFrame
         */
        const modal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        const qrModal = document.getElementById('qr-modal');
        const qrContent = document.getElementById('qr-modal-content');

        function showNotification(message) {
            document.getElementById('modal-message').textContent = message;
            modal.classList.remove('hidden');
            
            // Allow DOM to update hidden state before triggering CSS transition
            requestAnimationFrame(() => {
                modal.classList.add('opacity-100', 'pointer-events-auto');
                modalContent.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeNotification() {
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modalContent.classList.remove('scale-100', 'opacity-100');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function openQRModal() {
            qrModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                qrModal.classList.add('opacity-100', 'pointer-events-auto');
                qrContent.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeQRModal() {
            qrModal.classList.remove('opacity-100', 'pointer-events-auto');
            qrContent.classList.remove('scale-100', 'opacity-100');
            
            setTimeout(() => {
                qrModal.classList.add('hidden');
            }, 400); 
        }

        // Performance: Avoid context menu to prevent unexpected lag on long-press
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Security & Stability
        document.onkeydown = e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
                return false;
            }
        };
    </script>
